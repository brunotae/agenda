<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê Lume · Demonstração MINTESS</title>
<meta name="theme-color" content="#FBF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#C2563A;
  --bg:#FBF8F4; --s1:#FFFFFF; --s2:#F5F0EA; --s3:#ECE4DA; --line:#E6DDD2;
  --tx:#2A221C; --mu:#7A6B5F; --mu2:#A0918A;
  --ok:#2F8F5B; --warn:#B7791F; --bad:#C2413A; --blue:#2E6BC6;
  --r:12px;
  --acc-soft:color-mix(in srgb, var(--acc) 12%, white);
  --acc-line:color-mix(in srgb, var(--acc) 35%, white);
  --acc-dark:color-mix(in srgb, var(--acc) 80%, black);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);overflow-x:hidden}
body{font:13px/1.45 Poppins,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
svg{flex:none}

/* ---------- demo banner ---------- */
#banner{position:sticky;top:0;z-index:35;background:var(--tx);color:#fff;font-size:11.5px;padding:6px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#banner b{color:#fff}
#banner .sp{flex:1}
#banner button{color:#fff;opacity:.85;text-decoration:underline}
.mint{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#3FE0B0;color:#04241A;font-weight:800;font-size:11px}

/* ---------- entrada ---------- */
#entrada{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center;padding:28px 16px}
.ecard{width:100%;max-width:440px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 30px 70px -40px rgba(60,30,10,.35)}
.ecard h1{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15;margin:10px 0 6px}
.ecard p{color:var(--mu)}
.f{margin-bottom:12px}
.f>label{display:block;font-size:11.5px;color:var(--mu);font-weight:500;margin-bottom:5px}
.f>label em{color:var(--acc);font-style:normal}
.in{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0}
.in:focus{border-color:var(--acc)}
textarea.in{min-height:76px;resize:vertical}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 15px;font-weight:600;font-size:12.5px;min-height:36px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-dark)}
.btn.sec{background:var(--s1);border:1px solid var(--line)}
.btn.ghost{color:var(--mu)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:5px 11px;min-height:30px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{padding:6px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:12px;min-height:34px}
.pk button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pk button.dis{opacity:.35;pointer-events:none;text-decoration:line-through}

/* ---------- app ---------- */
#app{display:flex;min-height:calc(100vh - 32px)}
#side{width:212px;flex:none;background:var(--s1);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:32px;height:calc(100vh - 32px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.brand b{font-weight:800;font-size:15px;line-height:1.15;letter-spacing:-.2px;display:block}
.brand small{font-size:10.5px;color:var(--mu)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--mu);text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:var(--acc-soft);color:var(--acc-dark);font-weight:600}
.nav .lock{margin-left:auto;font-size:10px;color:var(--mu2)}
.side-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:11px;color:var(--mu)}
main{flex:1;min-width:0;padding:18px 22px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.top .sp{flex:1}
.role{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12px}
.role select{border:0;background:var(--s2);border-radius:999px;padding:4px 8px;font-weight:600;outline:0}
#bottom{display:none}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card .l{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px}
.card .v{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.card .d{font-size:10.5px;color:var(--mu2)}
.card.warn .v{color:var(--warn)} .card.bad .v{color:var(--bad)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.panel h3{font-size:13.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.muted{color:var(--mu)} .small{font-size:11px} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--s2);color:var(--mu);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok);background:#E9F6EF;border-color:#BFE3CF}
.chip.warn{color:var(--warn);background:#FBF1DF;border-color:#EBD3A6}
.chip.bad{color:var(--bad);background:#FBE7E5;border-color:#EFC1BC}
.chip.acc{color:var(--acc-dark);background:var(--acc-soft);border-color:var(--acc-line)}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;color:var(--mu2);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
td{padding:8px;border-bottom:1px solid var(--s3);font-size:12.5px;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--s2)}
.r{text-align:right}
.empty{color:var(--mu);text-align:center;padding:18px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mu)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);min-height:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:5px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:12px;font-weight:600}
.tab.on{background:var(--tx);border-color:var(--tx);color:#fff}

/* produtos */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.prod{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.prod:hover{border-color:var(--acc-line)}
.ph{height:96px;display:grid;place-items:center;position:relative}
.ph .dots{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.ph .dots i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.prod .b{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.prod .b b{font-size:13px;font-weight:600;line-height:1.25}
.prod .pr{font-weight:700;color:var(--acc-dark)}
.mini{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.mini i{width:10px;height:10px;border-radius:3px}

/* grade */
.grade{border-collapse:separate;border-spacing:5px;margin:-5px}
.grade th{border:0;text-align:center;padding:2px 4px;text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--mu)}
.grade th.cor{text-align:left;white-space:nowrap}
.grade td{border:0;padding:0}
.cell{width:62px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;position:relative}
.cell.ok{background:#E9F6EF;color:var(--ok)} .cell.warn{background:#FBF1DF;color:var(--warn)} .cell.bad{background:#FBE7E5;color:var(--bad)}
.cell button{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.8);font-weight:700;font-size:13px;line-height:1;color:var(--tx)}
.cell button:hover{background:#fff}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mu);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* venda */
.cart{background:var(--s2);border-radius:12px;padding:10px 12px}
.cl{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.cl .n{flex:1}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:8px}

/* permissões */
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:800} .no{color:var(--mu2)}

/* modal */
#mback{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{width:100%;max-width:560px;background:var(--s1);border-radius:18px;box-shadow:0 30px 80px -20px rgba(40,20,10,.5)}
.modal.wide{max-width:760px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h2{font-size:15px;font-weight:800;flex:1}
.mb{padding:14px 16px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;font-size:12.5px;z-index:90;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.toast.win{background:var(--ok)}

/* missões */
#missBtn{position:fixed;right:18px;bottom:20px;z-index:50;background:var(--tx);color:#fff;border-radius:999px;padding:10px 16px 10px 12px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
#missBtn .pr{width:26px;height:26px;border-radius:50%;background:conic-gradient(#3FE0B0 var(--p,0%), rgba(255,255,255,.18) 0);display:grid;place-items:center;font-size:10px}
#missBtn .pr span{width:20px;height:20px;border-radius:50%;background:var(--tx);display:grid;place-items:center}
#miss{position:fixed;right:18px;bottom:76px;z-index:55;width:330px;max-width:calc(100vw - 24px);background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 60px -20px rgba(40,20,10,.45);overflow:hidden}
#miss .mh{background:var(--tx);color:#fff;border:0}
.mi{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--s3);width:100%;text-align:left}
.mi:hover{background:var(--s2)}
.mi .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;font-size:12px;color:#fff}
.mi.done .ck{background:var(--ok);border-color:var(--ok)}
.mi.done b{text-decoration:line-through;color:var(--mu)}
.mi b{font-size:12.5px;font-weight:600;display:block}
.lv{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-top:3px}
.lv1{background:#DDF7EE;color:#167A5B} .lv2{background:#E3EEFF;color:#2A5DB0} .lv3{background:#FFF3D1;color:#8A6400} .lv4{background:#FFE6D3;color:#A34A0E} .lvu{background:var(--s2);color:var(--mu)}
.glow{animation:glow 1.4s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--acc-line)}}

/* pedir */
.steps{display:flex;gap:6px;margin:12px 0}
.steps div{flex:1;font-size:11px;color:var(--mu2);text-align:center}
.steps div:before{content:"";display:block;height:5px;border-radius:9px;background:var(--s3);margin-bottom:5px}
.steps div.done{color:var(--tx)} .steps div.done:before{background:var(--ok)}
.steps div.now{color:var(--acc-dark);font-weight:700} .steps div.now:before{background:var(--acc)}
.res{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--s2)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}
.escada{display:flex;align-items:flex-end;gap:8px;height:150px;margin:10px 0}
.escada div{flex:1;border-radius:10px 10px 4px 4px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600}
.escada b{font-size:24px;font-weight:800;line-height:1}

@media (max-width:860px){
  #side{display:none}
  main{padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
  .cards{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  #bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
  #bottom button{flex:1 0 50px;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu);gap:2px;padding:4px 0}
  #bottom button.on{color:var(--acc-dark);font-weight:700}
  #missBtn{bottom:calc(70px + env(safe-area-inset-bottom))}
  #miss{bottom:calc(126px + env(safe-area-inset-bottom))}
  .hide-m{display:none}
  #mback{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100vh}
  .cell{width:52px}
}
</style>
</head>
<body>
<div id="banner"><span class="mint">M</span><span><b>Demonstração MINTESS</b><span class="hide-m"> · dados fictícios, só neste aparelho.</span> Mexa à vontade!</span><span class="sp"></span><button data-act="recomecar">Recomeçar</button></div>

<!-- ============ ENTRADA ============ -->
<section id="entrada" hidden>
  <div class="ecard">
    <span class="chip acc">Demonstração · 5 minutos</span>
    <h1>Vamos montar o sistema da sua loja</h1>
    <p>Você vai experimentar um sistema de verdade: vender, controlar estoque, equipe e financeiro. Nada aqui é real, então pode testar tudo.</p>
    <div class="f" style="margin-top:18px"><label>Nome da sua loja <em>*</em></label><input class="in" id="eNome" placeholder="Ex.: Ateliê Lume" maxlength="40" autocomplete="off"></div>
    <div class="f"><label>Cor da sua marca</label><div class="sw" id="eCor"></div></div>
    <button class="btn pri full" data-act="comecar" style="margin-top:8px">Abrir meu sistema →</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <aside id="side"></aside>
  <main>
    <div class="top">
      <h1 id="ttl"></h1>
      <span class="sp"></span>
      <label class="role">Ver como <select id="papelSel" aria-label="Ver o sistema como"></select></label>
    </div>
    <div id="view"></div>
  </main>
  <nav id="bottom"></nav>
</div>

<button id="missBtn" hidden data-act="missToggle"><span class="pr"><span id="missN">0</span></span>Missões</button>
<div id="miss" hidden></div>
<div id="mback" hidden><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ===== configurar (MINTESS) ===== */
const CONTATO = { whatsapp: "" }; // ex.: "5511999999999" (vazio = a pessoa escolhe o contato)

/* ===== utilidades ===== */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = v => { const s=String(v??"").replace(/\s|R\$/g,""); const n=Number(s.includes(",")?s.replace(/\./g,"").replace(",","."):s); return isNaN(n)?0:n; };
const uid = () => Math.random().toString(36).slice(2,9);
const hoje = () => new Date().toISOString().slice(0,10);
const diasAtras = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const dataBR = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "";
const diffDias = s => Math.floor((Date.now()-new Date(s+"T12:00:00"))/86400000);
function toast(t, win){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const el=document.createElement("div"); el.className="toast"+(win?" win":""); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }
const CORES_MARCA = ["#C2563A","#2E4A7D","#5B7B3A","#B23A6E","#2A2A2A","#8A5A2B"];

const IC = {
  inicio:'<path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>',
  vender:'<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  estoque:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  financeiro:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  equipe:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.7c2 .7 3.5 2.4 3.5 5.3"/>',
  empresa:'<path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5M8 8h2M14 8h2M8 12h2M14 12h2"/>',
  pedir:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>'
};
const ic = (k, s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||""}</svg>`;

/* ===== papéis (níveis de acesso) ===== */
const TELAS = [
  {k:"inicio", t:"Início"}, {k:"vender", t:"Vender"}, {k:"estoque", t:"Estoque"},
  {k:"financeiro", t:"Financeiro"}, {k:"equipe", t:"Equipe e RH", c:"Equipe"}, {k:"empresa", t:"Minha empresa", c:"Empresa"}, {k:"pedir", t:"Pedir mudança", c:"Pedir"}
];
const PAPEIS = {
  dono:      {nome:"Dono",       telas:["inicio","vender","estoque","financeiro","equipe","empresa","pedir"], editarEstoque:true,  verCusto:true,  verSalario:true},
  gerente:   {nome:"Gerente",    telas:["inicio","vender","estoque","equipe","pedir"],                       editarEstoque:true,  verCusto:true,  verSalario:false},
  vendedor:  {nome:"Vendedor",   telas:["vender","estoque"],                                                 editarEstoque:false, verCusto:false, verSalario:false},
  financeiro:{nome:"Financeiro", telas:["inicio","financeiro"],                                              editarEstoque:false, verCusto:true,  verSalario:true}
};
const pode = k => PAPEIS[S.papel][k];

/* ===== missões ===== */
const MISSOES = [
  {k:"preco",   t:"Mude o preço de uma peça",        n:"1", onde:"estoque",    dica:"Estoque → toque numa peça → Preço"},
  {k:"venda",   t:"Venda uma peça e veja a grade mudar", n:"u", onde:"vender",  dica:"Vender → escolha peça, cor e tamanho"},

/* ===== cálculos ===== */
const pid = id => S.produtos.find(p=>p.id===id);
const totalPeca = p => Object.values(p.estoque).reduce((s,n)=>s+n,0);
const celulasBaixas = p => Object.values(p.estoque).filter(n=>n<=p.min).length;
const estado = (p,n) => n===0 ? "bad" : n<=p.min ? "warn" : "ok";
function vendasDo(dia){ return S.vendas.filter(v=>v.data===dia); }
function vendasMes(){ const m=hoje().slice(0,7); return S.vendas.filter(v=>v.data.slice(0,7)===m); }

      <div class="panel"><h3>Mais vendidas do mês</h3>${top.length?`<table><tbody>${top.map(([n,q],i)=>`<tr><td><b>${i+1}.</b> ${h(n)}</td><td class="r num"><b>${q}</b> un.</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Sem vendas ainda.</div>`}</div>

function cardProd(p){

    </div></button>`;
}
function fotoSvg(p){
  const c = p.cores[0].hex, s = 'fill="'+c+'" stroke="rgba(0,0,0,.18)" stroke-width="1.2"';
  const f = {
    Feminino: /calça/i.test(p.nome)?`<path ${s} d="M22 8h20l3 50h-10l-3-34-3 34H19z"/>`:/saia/i.test(p.nome)?`<path ${s} d="M24 12h16l10 40H14z"/>`:/blusa/i.test(p.nome)?`<path ${s} d="M20 10l8-4h8l8 4 8 10-8 5v25H20V25l-8-5z"/>`:`<path ${s} d="M24 6h16l2 12 10 40H12l10-40z"/>`,
    Masculino: /bermuda/i.test(p.nome)?`<path ${s} d="M18 12h28l4 32H36l-4-18-4 18H14z"/>`:`<path ${s} d="M20 10l8-4h8l8 4 10 10-8 6-4-4v34H22V22l-4 4-8-6z"/>`,
    Sapatos: `<path ${s} d="M8 40c0-6 4-10 10-10 6 0 10-6 14-8 4 4 10 8 18 10 4 1 6 4 6 8v4H8z"/>`,
    "Acessórios": /bolsa/i.test(p.nome)?`<path fill="none" stroke="${c}" stroke-width="3" d="M22 24c0-10 20-10 20 0"/><rect ${s} x="14" y="24" width="36" height="26" rx="5"/>`:/óculos/i.test(p.nome)?`<circle ${s} cx="20" cy="32" r="10"/><circle ${s} cx="44" cy="32" r="10"/><path stroke="${c}" stroke-width="3" d="M30 32h4"/>`:/cinto/i.test(p.nome)?`<rect ${s} x="6" y="28" width="52" height="9" rx="3"/><rect fill="none" stroke="#B8A47A" stroke-width="3" x="24" y="25" width="12" height="15" rx="2"/>`:`<path ${s} d="M10 14h44L40 50H24z"/>`
  }[p.cat] || `<rect ${s} x="14" y="14" width="36" height="36" rx="6"/>`;
  return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">${f}</svg>`;
}
function escolherVariacao(id){

function pintarTams(p){

        <textarea class="in" id="pTxt" placeholder="Ex.: quero ver quais vendedoras venderam mais por tamanho"></textarea>
        <div class="small muted" style="margin:10px 0 6px">Ideias para testar:</div>
        <div class="pk">${EXEMPLOS.map(e=>`<button type="button" data-act="exemplo" data-v="${h(e)}">${h(e)}</button>`).join("")}</div>
        <button class="btn pri" style="margin-top:12px" data-act="enviarPedido">Enviar pedido</button>
        <div id="pRes" style="margin-top:14px"></div>
      </div>
      <div>
        <div class="panel"><h3>Como funciona</h3>
          <div class="escada">
            <div style="height:45%;background:#DDF7EE;color:#167A5B"><b>1</b>Você muda</div>
            <div style="height:62%;background:#E3EEFF;color:#2A5DB0"><b>2</b>Pede aqui</div>
            <div style="height:80%;background:#FFF3D1;color:#8A6400"><b>3</b>Programador</div>
            <div style="height:100%;background:#FFE6D3;color:#A34A0E"><b>4</b>Projeto</div>
          </div>
          <p class="small muted">Correções são sempre sem custo.</p></div>
        <div class="panel" id="seusPed"><h3>Seus pedidos</h3>${ult.length?ult.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--s3)"><div>${h(p.txt)}</div><span class="lv ${LV[p.n][0]}">${LV[p.n][1]}</span></div>`).join(""):`<div class="empty">Nenhum ainda.</div>`}</div>
      </div>
    </div>`;
}
function listaPedidos(){ const ult=S.pedidos.slice(-4).reverse(); return `<h3>Seus pedidos</h3>`+(ult.length?ult.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--s3)"><div>${h(p.txt)}</div><span class="lv ${LV[p.n][0]}">${LV[p.n][1]}</span></div>`).join(""):`<div class="empty">Nenhum ainda.</div>`); }
function classificar(t){
  const s = " "+t.toLowerCase()+" ";
  const tem = a => a.some(k=>s.includes(k));
  if (tem(["instagram","site","loja virtual","e-commerce","ecommerce","nota fiscal","nfe","nf-e","mercado livre","shopee","ifood","integra","maquininha","whatsapp autom","marketplace","aplicativo na loja","app store"])) return "4";
  if (tem(["troca","devolu","etiqueta","campo novo","novo campo","status","pdf","nota de","permiss","tipo de acesso","novo acesso","cadastro de cliente","fidelidade","cashback"])) return "3";
  if (tem(["cor do sistema","mudar a cor","logo","preço","preco","coleç","coleca","forma de pagamento","pagamento novo","convidar","acesso para","dar acesso","estoque mínimo","estoque minimo","nome da loja","categoria"])) return "1";
  return "2";
}
const ONDE1 = t => /cor|logo|nome da loja/i.test(t)?["empresa","Minha empresa → Aparência"]:/convid|acesso/i.test(t)?["equipe","Equipe e RH → Convidar pessoa"]:/preço|preco/i.test(t)?["estoque","Estoque → toque na peça → Preço"]:["empresa","Minha empresa → Listas e opções"];
let PED_TIMER = null;
function enviarPedido(){
  const t = ($("#pTxt").value||"").trim();
  if (t.length < 6) { $("#pTxt").focus(); return toast("Escreva o que você quer mudar."); }
  const n = classificar(t);
  S.pedidos.push({txt:t, n, data:hoje()}); salvar();
  const box = $("#pRes"); const etapas = ["Recebido","Claude analisando","Preparando a prévia","Pronto para você ver"];
  const desenhar = i => `<div class="steps">${etapas.map((e,k)=>`<div class="${k<i?"done":k===i?"now":""}">${e}</div>`).join("")}</div>`;
  clearTimeout(PED_TIMER);
  box.innerHTML = desenhar(0) + `<div class="res"><span class="spin"></span> Lendo o seu pedido…</div>`;
  PED_TIMER = setTimeout(()=>{
    if (n==="1"){ const [v,onde]=ONDE1(t); box.innerHTML = desenhar(4) + `<div class="res"><span class="lv lv1">Nível 1 · você mesmo faz</span><p style="margin:8px 0">Boa notícia: isso você muda sozinho, agora mesmo, sem custo.</p><p class="small muted">Onde: <b>${h(onde)}</b></p><button class="btn pri sm" style="margin-top:10px" data-act="go" data-v="${v}">Me leve lá →</button></div>`; missao("pedido"); if (S.view==="pedir") { const sp=$("#seusPed"); if (sp) sp.innerHTML = listaPedidos(); } return; }
    if (n==="4"){ box.innerHTML = desenhar(4) + `<div class="res"><span class="lv lv4">Nível 4 · projeto</span><p style="margin:8px 0">Isso liga o seu sistema a outro serviço. A MINTESS prepara um <b>orçamento</b> e te envia em até 2 dias úteis.</p><p class="small muted">Exemplos: loja do Instagram, nota fiscal, marketplaces, maquininhas.</p></div>`; missao("pedido"); if (S.view==="pedir") { const sp=$("#seusPed"); if (sp) sp.innerHTML = listaPedidos(); } return; }
    let i = 1; box.innerHTML = desenhar(1) + `<div class="res"><span class="spin"></span> Claude entendeu o pedido e está planejando…</div>`;
    PED_TIMER = setTimeout(()=>{ box.innerHTML = desenhar(2) + `<div class="res"><span class="spin"></span> Aplicando a mudança numa cópia de teste do seu sistema…</div>`;
      PED_TIMER = setTimeout(()=>{
        const lv = n==="3" ? `<span class="lv lv3">Nível 3 · programador</span><p style="margin:8px 0">Esse pedido mexe na estrutura do sistema. Um programador da MINTESS faz e te mostra a prévia em até <b>5 dias úteis</b>, dentro das horas do seu plano.</p>`
                           : `<span class="lv lv2">Nível 2 · pedido no sistema</span><p style="margin:8px 0">Prévia pronta! No sistema real você abriria um link para conferir antes de ir ao ar. Prazo normal: <b>até 2 dias úteis</b>, dentro das horas do seu plano.</p>`;
        box.innerHTML = desenhar(4) + `<div class="res">${lv}<div class="small muted">O que vai mudar: <b>${h(t)}</b></div><div class="row" style="margin-top:10px"><span class="chip ok">✓ Você aprova</span><span class="chip">→ entra no ar</span><span class="chip">→ você é avisado</span></div></div>`;
        missao("pedido"); if (S.view==="pedir") { const sp=$("#seusPed"); if (sp) sp.innerHTML = listaPedidos(); }
      }, 1500);
    }, 1400);
  }, 1100);
}

/* ===== MISSÕES ===== */
function missao(k){
  if (S.missoes[k]) return;
  S.missoes[k] = true; salvar();
  const m = MISSOES.find(x=>x.k===k);
  const feitas = MISSOES.filter(x=>S.missoes[x.k]).length;
  toast(`✓ Missão: ${m.t} (${feitas}/${MISSOES.length})`, true);
  renderMissoes();
  if (feitas===MISSOES.length && !S.fimVisto) setTimeout(final, 1200);
}
function renderMissoes(){
  const feitas = MISSOES.filter(x=>S.missoes[x.k]).length;
  $("#missN").textContent = feitas;
  $("#missBtn").style.setProperty("--p", (feitas/MISSOES.length*100)+"%");
  if ($("#miss").hidden) return;
  $("#miss").innerHTML = `<div class="mh"><h2>Missões · ${feitas}/${MISSOES.length}</h2><button class="btn sm" style="color:#fff" data-act="missToggle">Fechar</button></div>
    ${MISSOES.map(m=>`<button class="mi ${S.missoes[m.k]?"done":""}" data-act="missIr" data-v="${m.k}"><span class="ck">${S.missoes[m.k]?"✓":""}</span><span><b>${m.t}</b><span class="small muted">${m.dica}</span><br><span class="lv ${LV[m.n][0]}">${LV[m.n][1]}</span></span></button>`).join("")}
    <div style="padding:10px 14px"><button class="btn sec sm full" data-act="final">Ver o resumo e falar com a MINTESS</button></div>`;
}
function final(){
  S.fimVisto = true; salvar();
  const feitas = MISSOES.filter(x=>S.missoes[x.k]).length;
  const msg = `Olá! Testei a demonstração da MINTESS como "${S.loja.nome}" (${feitas}/${MISSOES.length} missões) e quero conversar sobre um sistema para a minha loja.`;
  const link = CONTATO.whatsapp ? `https://wa.me/${CONTATO.whatsapp}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  modal(feitas===MISSOES.length?"Você completou a demonstração 🎉":"Resumo da demonstração", `
    <p style="font-size:15px;margin-bottom:6px">Em poucos minutos, <b>${h(S.loja.nome)}</b> vendeu, controlou estoque por cor e tamanho, cuidou da equipe e do financeiro.</p>
    <p class="muted">E você viu os quatro jeitos de mudar o sistema:</p>
    <div class="escada">
      <div style="height:45%;background:#DDF7EE;color:#167A5B"><b>1</b>Você muda</div>
      <div style="height:62%;background:#E3EEFF;color:#2A5DB0"><b>2</b>Pede no sistema</div>
      <div style="height:80%;background:#FFF3D1;color:#8A6400"><b>3</b>Programador</div>
      <div style="height:100%;background:#FFE6D3;color:#A34A0E"><b>4</b>Projeto</div>
    </div>
    <p class="muted">Agora imagine isso com as <b>suas</b> peças, a <b>sua</b> equipe e o jeito que a <b>sua</b> loja funciona.</p>`,
    `<button class="btn sec" data-act="fechar">Continuar testando</button><a class="btn ok" href="${h(link)}" target="_blank" rel="noopener">Quero o meu sistema →</a>`);
}

/* ===== modal ===== */
function modal(title, body, foot, o={}){
  const m = $("#modal"); m.className = "modal"+(o.wide?" wide":"");
  m.innerHTML = `<div class="mh"><h2>${title}</h2><button class="btn ghost sm" data-act="fechar">Fechar</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:""}`;
  $("#mback").hidden = false; document.body.style.overflow = "hidden";
}
function fechar(){ $("#mback").hidden = true; document.body.style.overflow = ""; }
$("#mback").addEventListener("click", e=>{ if (e.target.id==="mback") fechar(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && !$("#mback").hidden) fechar(); });

/* botões de opção (pick) */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-pickv]"); if (!b) return;
  const w = b.closest("[data-pk]"); const inp = document.getElementById(w.dataset.pk);
  if (inp) inp.value = b.dataset.pickv;
  w.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
});

/* ===== ações ===== */
const ACT = {
  eCor: el=>{ S.loja.cor = el.dataset.v; aplicarCor(); document.querySelectorAll("#eCor button").forEach(b=>b.classList.toggle("on", b===el)); },
  comecar: ()=>{ const n = $("#eNome").value.trim(); if (n) S.loja.nome = n; S.loja.instagram = "@"+S.loja.nome.toLowerCase().replace(/[^a-z0-9]+/gi,""); S.iniciado = true; salvar(); abrirApp(); setTimeout(()=>{ $("#miss").hidden=false; renderMissoes(); }, 400); },
  recomecar: ()=>{ try{ localStorage.removeItem(KEY); }catch(e){} CART=[]; S = semente(); fechar(); aplicarCor(); mostrarEntrada(); },
  go: el=>{ fechar(); S.view = el.dataset.v; S.cat = "Todas"; render(); scrollTo(0,0); },
  semAcesso: el=>toast(`🔒 ${PAPEIS[S.papel].nome} não tem acesso a "${TELAS.find(t=>t.k===el.dataset.v).t}"`),
  cat: el=>{ S.cat = el.dataset.v; render(); },
  addProd: el=>escolherVariacao(el.dataset.id),
  verProd: el=>verProd(el.dataset.id),
  vCor: el=>{ window.__v.cor = el.dataset.v; document.querySelectorAll("#vCor button").forEach(b=>b.classList.toggle("on", b===el)); pintarTams(pid($("#modal [data-act=addCart]").dataset.id)); },
  vTam: el=>{ window.__v.tam = el.dataset.v; document.querySelectorAll("#vTam button").forEach(b=>b.classList.toggle("on", b===el)); },
  vQtd: el=>{ window.__v.qtd = Number(el.dataset.v); document.querySelectorAll("#vQtd button").forEach(b=>b.classList.toggle("on", b===el)); },
  addCart: el=>{ const p = pid(el.dataset.id), v = window.__v; if (!v.tam) return toast("Sem estoque nessa cor."); const disp = p.estoque[v.cor+"|"+v.tam]||0; const ja = CART.filter(i=>i.pid===p.id&&i.cor===v.cor&&i.tam===v.tam).reduce((s,i)=>s+i.qtd,0); if (v.qtd+ja>disp) return toast(`Só tem ${disp} peça(s) ${v.cor} ${v.tam}.`); CART.push({pid:p.id, nome:p.nome, cor:v.cor, tam:v.tam, qtd:v.qtd, preco:p.preco}); fechar(); render(); },
  cartDel: el=>{ CART.splice(Number(el.dataset.v),1); render(); },
  finalizar: ()=>{ if (!CART.length) return; const tot = CART.reduce((s,i)=>s+i.preco*i.qtd,0);
    CART.forEach(i=>{ const p=pid(i.pid); p.estoque[i.cor+"|"+i.tam] = Math.max(0,(p.estoque[i.cor+"|"+i.tam]||0)-i.qtd); p.ultimaVenda = hoje(); });
    S.vendas.push({id:uid(), data:hoje(), itens:CART.map(i=>({pid:i.pid,nome:i.nome,cor:i.cor,tam:i.tam,qtd:i.qtd,preco:i.preco})), total:tot, pag:$("#pag").value, vendedor:$("#vend").value});
    const primeiro = CART[0]; CART = []; render(); toast(`Venda de ${brl(tot)} registrada ✓`); missao("venda");
    setTimeout(()=>{ if (pode("telas").includes("estoque")) toast(`Veja: a grade de ${primeiro.nome} já baixou 1 peça ${primeiro.cor} ${primeiro.tam}.`); }, 2700); },
  gMais: el=>ajustarGrade(el.dataset.v, +1),
  gMenos: el=>ajustarGrade(el.dataset.v, -1),
  salvarPreco: ()=>{ const p=pid(window.__pid), v=num($("#pPreco").value); if (v<=0) return toast("Preço inválido."); const mudou = Math.abs(v-p.preco)>0.001; p.preco=v; fechar(); render(); toast("Preço salvo ✓"); if (mudou) missao("preco"); },
  novaPeca: ()=>novaPeca(),
  salvarPeca: ()=>{ const nome=$("#nNome").value.trim(), preco=num($("#nPreco").value); if (!nome) return toast("Dê um nome à peça."); if (preco<=0) return toast("Informe o preço.");
    const cores=$("#nCores").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,4).map(n=>({nome:n,hex:hexDe(n)})); if (!cores.length) cores.push({nome:"Única",hex:"#B5A99C"});
    const tams=tamsDe($("#nTam").value), est={}; cores.forEach(c=>tams.forEach(t=>est[c.nome+"|"+t]=0));
    S.produtos.unshift({id:uid(), nome, cat:$("#nCat").value, colecao:$("#nCol").value, preco, custo:num($("#nCusto").value)||Math.round(preco*0.4), cores, tams, estoque:est, min:S.loja.minPadrao, ultimaVenda:hoje()});
    fechar(); render(); toast("Peça cadastrada. Toque nela para lançar o estoque na grade."); },
  importar: ()=>importar(),
  impOk: ()=>{ const linhas=$("#impTxt").value.split("\n").map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(c=>c[0]); let n=0;
    linhas.forEach(c=>{ const cat = S.listas.categorias.find(x=>x.toLowerCase()===(c[1]||"").toLowerCase()) || S.listas.categorias[0]; const tams = cat==="Acessórios"?["U"]:cat==="Sapatos"?["38","39","40","41","42","43"]:["P","M","G","GG"]; const q=Math.max(0,Math.round(num(c[3]))); const est={}; tams.forEach((t,i)=>est["Única|"+t]=Math.floor(q/tams.length)+(i<q%tams.length?1:0));
      S.produtos.unshift({id:uid(), nome:c[0], cat, colecao:S.listas.colecoes[0], preco:num(c[2])||99.9, custo:Math.round((num(c[2])||99.9)*0.4), cores:[{nome:"Única",hex:"#B5A99C"}], tams, estoque:est, min:S.loja.minPadrao, ultimaVenda:hoje()}); n++; });
    fechar(); S.cat="Todas"; render(); toast(`${n} peça(s) importada(s) ✓`); },
  novaDespesa: ()=>novaDespesa(),
  salvarDespesa: ()=>{ const d=$("#dDesc").value.trim(), v=num($("#dValor").value); if (!d) return toast("Descreva a despesa."); if (v<=0) return toast("Informe o valor.");
    S.despesas.push({id:uid(), desc:d, cat:$("#dCat").value, valor:v, venc:$("#dVenc").value||hoje(), pago:$("#dPago").value==="sim"}); fechar(); render(); toast("Despesa lançada ✓"); missao("despesa"); },
  pagar: el=>{ const d=S.despesas.find(x=>x.id===el.dataset.id); d.pago=true; render(); toast("Conta paga ✓"); },
  convidar: ()=>convidar(),
  convidarOk: ()=>{ const n=$("#cNome").value.trim(), e=$("#cEmail").value.trim(); if (!n) return toast("Informe o nome."); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) return toast("Confira o e-mail.");
    S.equipe.push({id:uid(), nome:n, cargo:$("#cCargo").value, papel:$("#cPapel").value, salario:num($("#cSal").value), comissao:num($("#cCom").value), admissao:hoje(), email:e, status:"convidado"});
    fechar(); render(); missao("convite");
    modal("Convite pronto ✓", `<p><b>${h(n)}</b> foi convidada como <span class="chip acc">${PAPEIS[$("#cPapel")?.value||"vendedor"]?.nome||"Vendedor"}</span>.</p><p class="muted" style="margin-top:8px">No sistema real, ela recebe um link por WhatsApp ou e-mail, cria a senha e já entra vendo só o que o acesso dela permite.</p>`, `<button class="btn pri" data-act="fechar">Ótimo</button>`); },
  editPessoa: el=>editPessoa(el.dataset.id),
  salvarPessoa: ()=>{ const e=S.equipe.find(x=>x.id===window.__eid); e.papel=$("#ePapel").value; e.salario=num($("#eSal").value); e.comissao=num($("#eCom").value); e.status=$("#eSt").value; fechar(); render(); toast("Dados salvos ✓"); },
  salvarLoja: ()=>{ document.querySelectorAll("[data-loja]").forEach(i=>{ S.loja[i.dataset.loja] = i.value.trim() || S.loja[i.dataset.loja]; }); render(); toast("Dados da empresa salvos ✓"); },
  corLoja: el=>{ S.loja.cor = el.dataset.v; render(); toast("Cor da marca aplicada ✓"); },
  listaAdd: el=>{ const k=el.dataset.k; modal(`Adicionar em ${h(el.dataset.t)}`, `<div class="f"><label>Novo item</label><input class="in" id="liNovo" placeholder="Digite e salve"></div>`, `<button class="btn sec" data-act="fechar">Cancelar</button><button class="btn pri" data-act="listaOk" data-k="${k}">Adicionar</button>`); setTimeout(()=>$("#liNovo").focus(),50); },
  listaOk: el=>{ const v=$("#liNovo").value.trim(); if (!v) return toast("Digite o item."); const k=el.dataset.k; if (!S.listas[k].includes(v)) S.listas[k].push(v); fechar(); render(); toast("Adicionado ✓"); },
  listaDel: el=>{ const k=el.dataset.k, i=Number(el.dataset.i); if (S.listas[k].length<=1) return toast("Deixe pelo menos um item."); S.listas[k].splice(i,1); render(); },
  minPadrao: el=>{ const n=Number(el.dataset.v); S.loja.minPadrao=n; S.produtos.forEach(p=>p.min=n); render(); toast("Alerta de estoque ajustado ✓"); },
  exemplo: el=>{ $("#pTxt").value = el.dataset.v; $("#pTxt").focus(); },
  enviarPedido: ()=>enviarPedido(),
  missToggle: ()=>{ $("#miss").hidden = !$("#miss").hidden; renderMissoes(); },
  missIr: el=>{ const m=MISSOES.find(x=>x.k===el.dataset.v); if (m.k==="papel"){ $("#papelSel").focus(); $("#papelSel").closest(".role").classList.add("glow"); setTimeout(()=>$(".role")?.classList.remove("glow"),4500); toast(m.dica); return; }
    if (!PAPEIS[S.papel].telas.includes(m.onde)){ S.papel="dono"; toast("Voltando para o acesso de Dono."); } S.view=m.onde; render(); toast(m.dica); if (innerWidth<860) $("#miss").hidden=true; },
  final: ()=>final(),
  fechar: ()=>fechar()
};
document.addEventListener("click", e=>{ const el=e.target.closest("[data-act]"); if (!el) return; if (el.tagName==="A" && !el.href.startsWith("http")) e.preventDefault(); const f=ACT[el.dataset.act]; if (f){ if (el.tagName==="A") e.preventDefault(); f(el); } });
$("#papelSel").addEventListener("change", e=>{ S.papel = e.target.value; CART=[]; render(); toast(`Agora você vê o sistema como ${PAPEIS[S.papel].nome}`); if (S.papel==="vendedor") missao("papel"); });
$("#eNome").addEventListener("keydown", e=>{ if (e.key==="Enter") ACT.comecar(); });
iniciar();
</script>
